
[env]
# The test suite runs on UTC's clock, wherever it runs, so a test written for
# "noon" means noon. Only affects `cargo test`/`cargo run`; the built program
# reads the machine's own zone. See `src/localclock.rs`.
ATLAS_CLOCK_OFFSET = "0"

# Tests make hundreds of scratch folders and few remove them (18 runs left
# 11,452 folders, 12 GB, in the system temp dir: ledger Q21). Under cargo
# they go in this build's own target/tmp instead, which `roots::data_home`
# clears of earlier runs' leftovers. TMP and TEMP are what Windows reads,
# TMPDIR what Linux and macOS read; `force` because Windows always has them.
TMPDIR = { value = "target/tmp", relative = true, force = true }
TMP = { value = "target/tmp", relative = true, force = true }
TEMP = { value = "target/tmp", relative = true, force = true }
