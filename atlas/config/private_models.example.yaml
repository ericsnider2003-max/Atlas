# Copy into the user-local Atlas configuration only after installing private
# artifacts. Do not enable this in the public package.
private_models:
  root: "C:/Users/<user>/Atlas-private"
  reasoning:
    enabled: false
    manifest: "reasoning/manifest.json"
    # The existing `llm:` contract remains the runtime seam. A local
    # llama-server, Ollama-compatible server, or user-local command may be used.
    mode: "validated_json"
    max_context_chars: 12000
    timeout_seconds: 45
  voice:
    enabled: false
    manifest: "voice/manifest.json"

# Public Atlas behavior is unchanged when this file is absent: deterministic
# commands run first, then the configured normal fallback model.
