# Longest phrase wins, so "open workspace" is not swallowed by "open".
commands:
  - intent: workspace_on
    describe: "Open and arrange the user's whole workspace (all their work apps, laid out on the screens)."
    expose: core
    phrases: ["boot workspace", "turn on workspace", "start workspace", "open workspace", "workspace on"]

  - intent: workspace_off
    describe: "Close all the workspace apps."
    phrases: ["shutdown workspace", "turn off workspace", "close workspace", "workspace off"]

  - intent: view_display
    describe: "Take a screenshot and look at what is on the user's screen, e.g. to read a chart or explain what is showing."
    expose: core
    # Answered by the local picture reader (`picture_talk`): a screenshot,
    # asked about in the words you used, then deleted.
    phrases: ["view my display", "look at my screen", "view display",
              "what's on my screen", "whats on my screen", "what is on my screen",
              "what does this chart show", "what does this graph show",
              "read this chart", "explain this chart", "read this graph"]

  - intent: research
    describe: "Look a topic up on the web and write a note about it. arg: the topic."
    expose: core
    phrases: ["research", "look into", "find information on", "look up", "search for", "search the web for",
              "google", "find out about", "look it up"]
    takes_argument: true

  - intent: open_app
    describe: "Open an app by name. arg: the app's name, only one from the known apps."
    expose: core
    phrases: ["open", "launch"]
    takes_argument: true

  # Names only (27 Sep 2026): "close" and "quit" take an app you have, so
  # "quit smoking" and "close the deal" reach the model rather than looking
  # for an app called "smoking". "open" stays open to any name -- an app you
  # haven't set up is still asked about (`grants`).
  - intent: close_app
    describe: "Close an app by name. arg: the app's name."
    expose: core
    phrases: ["close", "quit"]
    takes_argument: true
    names_only: true

  - intent: focus_app
    describe: "Bring an open app to the front. arg: the app's name."
    expose: core
    phrases: ["focus", "switch to", "go to"]
    takes_argument: true
    # "go to chrome", not "go to sleep".
    names_only: true

  # Turning hand control on. Said once, or pressed in the hub, or -- if you
  # have the wake shape switched on -- held up without saying anything.
  - intent: gestures_on
    describe: "Start watching the user's hands so they can control things with gestures."
    phrases: ["watch my hands", "hand control", "let me use my hands",
              "gesture mode", "read my hands", "i want to use gestures"]

  - intent: gestures_off
    describe: "Stop watching the user's hands."
    phrases: ["stop watching my hands", "stop reading my hands",
              "hands off", "no more gestures", "leave my hands alone"]

  - intent: pause
    describe: "Stop talking and suspend all work until told to resume."
    expose: never
    phrases: ["pause", "hold on", "hold up", "wait", "hang on", "one moment", "give me a minute", "stand by"]
    # The whole sentence (27 Sep 2026): "wait" pauses; "wait, what do you
    # mean" is a question and goes to the model.
    anchored: true

  - intent: resume
    describe: "Carry on after a pause."
    expose: never
    # "I'm ready" is deliberately not here — it means you have arrived at the
    # desk, which is the waking moment, not a resume. The daemon still treats
    # it as a resume if something is actually paused.
    phrases: ["resume", "carry on", "keep going", "im back", "i am back", "unpause", "continue"]
    # "continue" resumes; "continue the story" is conversation.
    anchored: true

  - intent: outstanding
    describe: "List what Atlas was asked to do and could not do yet."
    phrases: ["what's outstanding", "whats outstanding", "what couldn't you do", "what is on your list", "your list"]

  - intent: queued
    describe: "List posts and messages waiting to be sent, and scheduled jobs."
    phrases: ["what's queued", "whats queued", "what's going out", "whats going out", "what's scheduled", "whats scheduled"]

  - intent: draft_post
    describe: "Draft a social post or email for a channel (never sends it). arg: the channel: x, linkedin, instagram, discord or email."
    phrases: ["draft a post for", "write a post for", "draft post", "post to"]
    takes_argument: true

  - intent: undo
    describe: "Put back the last thing Atlas moved, closed or overwrote."
    phrases: ["undo", "undo that", "put it back", "revert that"]

  - intent: back_up
    describe: "Back up everything Atlas has learned to a safe place."
    phrases: ["back up", "back everything up", "make a backup"]

  # The relief text `nudge::drifted` offers is "rebuilding the index". It has
  # to parse to something that actually rebuilds, or saying yes to the nudge
  # agrees to nothing happening.
  # You told Atlas it got something wrong. One correction is a note; two on
  # separate occasions is a rule -- `revise`'s third rule, and the one that
  # stops Atlas rebuilding itself around one irritable evening.
  - intent: got_it_wrong
    describe: "Record that Atlas got something wrong, with the correction."
    expose: never
    phrases: ["that's wrong", "thats wrong", "that's not right", "thats not right",
              "you got that wrong", "no that's wrong", "that was too long",
              "too long", "too short", "that's not what i asked", "thats not what i asked",
              "i didn't ask for that", "i didnt ask for that", "don't do that",
              "dont do that", "wrong again"]

  # The command the mending offer's own relief parses to. `Home::plain()`
  # produces these exact phrases, so saying yes to "I want to change the
  # instructions for that job" runs something rather than nothing -- the trap
  # that `nudge::drifted` fell into and this is built to avoid.
  - intent: apply_lesson
    describe: "Turn a correction into a standing rule."
    expose: never
    phrases: ["updating the instructions for that job",
              "updating what i know about how you like things",
              "updating the record",
              "write it down", "make it a rule", "apply the lesson"]

  # What Atlas can actually run here. The budget is measured, not configured:
  # `fit.rs` reads real memory, and a config number that disagrees with it
  # produces a model that will not load.
  - intent: which_model
    describe: "Say which language model Atlas is running and what this machine can run."
    phrases: ["which model", "what model are you using", "what model",
              "which model are you running", "what models do i have",
              "what can you run", "models"]

  # The only metric this loop has: does it make the same mistake twice.
  # Where the time went, from the work log (`worklog`): today, yesterday,
  # this week. Local; nothing leaves the machine.
  - intent: time_spent
    describe: "Report where the user's time went today or on a given day, from the work log. arg: the day or app, optional."
    phrases: ["where did my time go", "where did the time go", "what did i work on",
              "how long was i on", "how did i spend my time", "time report",
              "how much time did i spend", "what have i been doing today",
              "how productive was i", "my focus today"]
    # What's left over ("... on youtube", "... yesterday") is what to report on.
    takes_argument: true
    argument_optional: true

  - intent: how_am_i_doing
    describe: "Say how Atlas itself has been doing: corrections it was given and what it learned."
    # "how are you doing" was here, so "how are you doing?" got a report on
    # corrections instead of an answer (27 Sep 2026). It's conversation now.
    phrases: ["how am i doing", "have you got any better",
              "are you getting better", "what have i corrected you on",
              "what have you learned"]
    anchored: true

  # A room of seats that do not agree with each other, put to a question.
  # Scoped to hardware because that is the subject Atlas has measured numbers
  # for -- `council::hardware_room` hands every seat the real machine, so the
  # seats disagree about 15.7GB rather than about the word "upgrade". Anything
  # else asked this way gets the general room.
  #
  # Costs one model call per seat. `atlas trace` shows what it spent.
  - intent: ask_the_room
    describe: "Put a question to several differing viewpoints and report where they disagree. arg: the question."
    phrases: ["ask the room", "put it to the room", "what does the room think",
              "convene the council", "council", "second opinions", "argue both sides",
              "should i upgrade", "is it worth upgrading", "what do you think about upgrading"]

  # The flight recorder, read back. `nudge::trace_line` is the one thing that
  # turns it into a sentence, and it had no caller because nothing asked.
  - intent: model_trace
    describe: "Report what Atlas has been asking its language model lately and how long it took."
    # "what have you been doing" is a question to Atlas, not about the model.
    phrases: ["what have you been asking", "how's the model doing",
              "hows the model doing", "what's the model been doing", "whats the model been doing",
              "model trace", "how many times have you asked the model"]

  - intent: rebuild_index
    describe: "Rebuild the index of the user's notes and files."
    phrases: ["rebuilding the index", "rebuild the index", "rebuild the index of my notes",
              "reindex my notes", "rebuild my notes index", "update the index"]

  # With a subject, the index says which notes are worth opening — the point
  # of keeping one. Without a subject, it says how much Atlas knows it has
  # without opening any of it.
  - intent: what_i_have
    describe: "Look in the user's notes for what Atlas has on a subject. Call it rather than saying you will look. arg: the subject, optional."
    expose: core
    phrases: ["what do you have on", "what do you know about", "what have you got on",
              "what's in my notes", "whats in my notes", "what have you got written down",
              "what do you have written down"]
    takes_argument: true
    argument_optional: true

  - intent: machine_health
    describe: "Check the computer's health: memory, disk, CPU and what is slowing it down."
    phrases: ["how's the machine", "hows the machine", "system status", "machine health", "what's slowing this down", "whats slowing this down",
              "check the laptop", "why is this slow"]

  - intent: self_check
    describe: "Run Atlas's self-check and say what setup is still missing."
    phrases: ["check yourself", "self check", "run a self check", "run a checkup",
              "are you working", "are you working right", "are you set up right",
              "make sure you're working", "check that you're working",
              "what's outstanding in your setup", "whats outstanding in your setup", "what's left to set up",
              "whats left to set up", "what's missing in your setup", "whats missing in your setup",
              "is your setup finished", "is setup finished", "are you fully set up",
              # Eric, 29 Sep 2026: asked for these and was told Atlas can't.
              "report on yourself", "a report on yourself", "generate a report on yourself",
              "give me a report on yourself", "status report", "self report", "diagnostic report",
              "what still needs to be set up", "what still needs setting up", "what needs to be set up",
              "what still needs set up"]

  - intent: shakedown
    describe: "Run the commissioning shakedown over every capability that has never run on this machine."
    phrases: ["run a shakedown", "shakedown", "commission yourself", "run your commissioning",
              "verify everything", "what do you need me to verify", "run the commissioning"]

  # "switch to" is not here: `focus_app` claims it, and the longest-phrase
  # rule cannot separate two identical phrases, so this one never fired. Left
  # out rather than left in and dead.
  - intent: set_mode
    describe: "Switch to a named mode such as focus, call or research. arg: the mode's name."
    phrases: ["mode", "go into"]
    takes_argument: true
    # A mode you have: "go into focus", not "go into detail".
    names_only: true

  - intent: use_clipboard
    describe: "Do something with what the user copied: explain, summarise, reply to or clean it up. arg: what to do."
    # "what is this" and "what does this mean" were here: in conversation
    # they are about what was just said, not the clipboard (27 Sep 2026).
    phrases: ["explain this", "summarise this", "summarize this", "reply to this", "what i copied", "clean this up",
              "what does what i copied mean", "explain what i copied"]

  - intent: rehearse
    describe: "Show what Atlas would do for a command, without doing it. arg: the command."
    phrases: ["rehearse", "what would you do if i said", "show me what you'd do", "show me what youd do", "dry run"]
    takes_argument: true

  - intent: ready
    describe: "The user has arrived and is ready to start: give the morning brief."
    expose: never
    phrases: ["i'm ready", "im ready", "ready", "let's go", "lets go", "good morning atlas", "wake up"]
    # "let's go through the numbers" is not the morning brief.
    anchored: true

  - intent: show_panel
    describe: "Put a panel on screen, such as the task list or Atlas's thinking. arg: which panel."
    phrases: ["show me", "pull up", "put up", "bring up", "let me see"]
    takes_argument: true

  - intent: dismiss_panel
    describe: "Take the panel on screen down."
    phrases: ["dismiss", "close that", "take it down", "hide that", "that's enough", "thats enough"]
    anchored: true

  - intent: capabilities
    describe: "Say what Atlas can do, what is new, or whether it can do a particular thing. arg: the thing, optional."
    # "can you" and "what can you" were here, so every "can you …" became a
    # question about Atlas. "can you X" is read as a polite "X" (`polite_rest`).
    phrases: ["what can you do", "what's new", "whats new",
              "what are you waiting on", "what can't you do", "what cant you do",
              "what's left", "whats left"]
    takes_argument: true
    argument_optional: true

  - intent: history
    describe: "Say what Atlas did recently, or change something it did back. arg: what, optional."
    # "undo", "undo that" and "put it back" were listed here as well as under
    # `undo`. Two commands cannot share a phrase — the longest-phrase rule has
    # nothing left to separate them by, so one of the pair simply never fires.
    # These three were the ones that never fired.
    phrases: ["what did you do", "what have you done", "what changed", "what just happened",
              "change it back", "go back", "revert",
              "take it back", "that was wrong"]
    takes_argument: true
    argument_optional: true


  # The conversation itself, read back — as opposed to `history`, which is the
  # log of what Atlas *did*. `session::transcript` already assembles the recent
  # turns for the model; this is the one thing that reads them to you.
  - intent: recap
    describe: "Read back a recap of this conversation."
    phrases: ["recap our conversation", "recap the conversation", "recap this conversation",
              "read back our conversation", "read our conversation back",
              "what have we been talking about", "what were we talking about",
              "our conversation so far", "recap our chat"]

  # The autonomy ledger read back: what Atlas will do on its own and where it
  # still asks first, per kind of work. Distinct from `how_am_i_doing` (which
  # reports corrections and rules): this reads the `earned` confidence record
  # that decides whether Atlas acts alone, through `earned::may_act_alone` and
  # `earned::rope`. A local, offline read of state Atlas already holds.
  - intent: act_alone
    describe: "Say what Atlas does on its own without asking, and where it still asks first."
    phrases: ["what can you do on your own", "what do you do on your own",
              "what can you do without asking", "what do you do without asking me",
              "where do you still ask me first", "what have you earned",
              "what are you trusted to do", "how much do you trust yourself"]

  # The size of the knowledge store, read back -- how much research has folded
  # in and roughly what it costs. Distinct from `what_i_have` ("what do you
  # know about X" opens a subject); this asks about the whole store's size and
  # the promise that it does not grow without bound. Offline, reads a count
  # Atlas already holds.
  - intent: knowledge_size
    describe: "Say how much Atlas knows and remembers."
    phrases: ["how much do you know", "how big is your memory",
              "how much have you learned", "how full is your memory",
              "does your knowledge keep growing", "how much have you got stored",
              "how much do you remember"]

  # You told Atlas a captured note was filed wrong. The argument after the
  # phrase decides the fix: a kind ("that's actually a task") changes what sort
  # of thing the note is, a name ("file that under the roof job") adds a handle
  # you can find it by later. The correction lands on the most recent note and
  # marks it confirmed, so `capture::Notebook::correct` -- the one writer that
  # records a filing correction -- finally has a phrase that reaches it.
  # Offline; rewrites the local notebook and nothing else.
  - intent: refile
    describe: "File the last note under a different kind. arg: the kind."
    phrases: ["file that under", "refile that under", "refile that as",
              "that's actually a", "thats actually a", "no that's a",
              "no thats a", "that note is actually a", "refile that",
              "refile it as", "put that under"]
    takes_argument: true

  # A symptom you describe, matched against the snags in Atlas's shipped
  # procedures. Distinct from `machine_health` ("why is this slow" reads the
  # live vitals) and from asking how to do something: this starts from what
  # went wrong and names the likely cause and fix, offline, from
  # `knowhow::for_symptom`.
  - intent: diagnose
    describe: "Troubleshoot a problem the user describes and suggest fixes. arg: the problem."
    phrases: ["troubleshoot", "help me fix", "what's going wrong with", "whats going wrong with",
              "what should i do about", "diagnose", "why does it keep", "why won't"]
    takes_argument: true
    argument_optional: true

  # The steps of a task Atlas has a shipped procedure for, read back in order.
  # Distinct from `diagnose` (which starts from a symptom): this starts from a
  # task and reads `knowhow::for_request` + `knowhow::as_plan`, offline. The
  # Unknown fallback already reaches the same match but only ever says "I know
  # this one, N steps" -- these phrases ask for the steps themselves.
  - intent: walk_through
    describe: "Walk the user step by step through how to do something on their computer. arg: the task."
    phrases: ["walk me through", "talk me through", "show me how to", "show me the steps to",
              "steps to", "steps for"]
    takes_argument: true
    argument_optional: true

  - intent: why
    describe: "Explain why Atlas did or said something. arg: what, optional."
    phrases: ["why did you", "why is that", "why that one", "explain that"]
    takes_argument: true
    argument_optional: true

  - intent: pair
    describe: "Invite another device of the user's to pair with this Atlas. arg: the device's name."
    phrases: ["pair with", "pair", "invite", "set up a pairing with"]
    takes_argument: true
    raw_argument: true

  - intent: accept_pairing
    describe: "Accept a pairing code from another device. arg: the code exactly as pasted."
    phrases: ["accept pairing", "accept this pairing", "accept invite"]
    takes_argument: true
    raw_argument: true

  - intent: forget_peer
    describe: "Remove a paired device. arg: its name."
    phrases: ["forget my pairing with", "forget pairing with", "unpair", "remove pairing with"]
    takes_argument: true
    raw_argument: true

  # Coming back to what setup skipped. `firstrun.rs` says, in its own words,
  # "say \"finish setting up\" when you want to" -- and until now nothing
  # parsed that. Found by tests/it_can_do_what_it_says.rs.
  - intent: finish_setup
    describe: "Carry on with Atlas's setup where it was left."
    phrases: ["finish setting up", "finish the setup", "carry on setting up",
              "back to setting up", "lets finish setup"]

  # Muting a topic by saying so. `config/tools.yaml` offers this as the
  # alternative to hand-editing `interrupt.muted`, and nothing heard it.
  # `raw_argument` because `interrupt::mute_from` reads the whole sentence.
  - intent: mute_topic
    describe: "Stop or start telling the user about a topic. arg: the topic."
    phrases: ["stop telling me about", "dont tell me about", "stop mentioning",
              "start telling me about", "start mentioning", "unmute",
              "what are you not telling me"]
    takes_argument: true
    argument_optional: true
    raw_argument: true

  # Face enrolment, which `config/tools.yaml` describes as "say this is me to
  # the camera once and it knows you".
  - intent: this_is_me
    describe: "Learn the user's face from the camera."
    expose: never
    phrases: ["this is me", "thats me", "that is me", "this is my face",
              "learn my face"]

  # Puts Atlas into a handover: somebody else has the laptop. Free to say,
  # by anyone, on purpose -- see src/handover.rs on the asymmetry. Entering
  # only ever narrows what Atlas will do, so guarding it would buy nothing
  # and would cost you the one moment you need it.
  #
  # `Hint::offer` has been telling people to say "hand over" since the day it
  # was written, and until now nothing parsed it. Found by
  # `tests/it_can_do_what_it_says.rs`, which exists because of it.
  - intent: hand_over
    describe: "Hand Atlas over to someone else for a while (guest mode)."
    # "You're talking to someone else now" was not here, and two guest tests
    # that say it passed only because the line wasn't understood: it became
    # "I didn't catch that. Go ahead?" and swallowed the guest's next request.
    # Once an unrecognised line stopped being an approval (26 Sep 2026) they
    # failed, which is how this was found.
    phrases: ["hand over", "hand it over", "guest mode", "this isnt mine right now",
              "someone else is using this", "somebody else is using this",
              "youre talking to someone else", "you're talking to someone else",
              "talking to someone else now", "youre talking to someone else now",
              "you're talking to someone else now", "someone else is here", "somebody else is here"]
    takes_argument: true
    argument_optional: true
    raw_argument: true

  # Ends a handover. The phrase summons a typed passphrase prompt and does
  # nothing else -- see src/handover.rs. It takes no argument on purpose: an
  # argument is what a spoken passphrase would arrive as, and there is no
  # branch anywhere that would read one.
  - intent: take_it_back
    describe: "End guest mode; the owner is back."
    # "im back" is deliberately NOT here. It belongs to `resume`, and has
    # since long before this command existed -- it is what you say to an
    # Atlas you paused. Claiming it here would have made one of the two
    # unreachable, which is exactly the failure
    # `tests/commands_are_distinct.rs` exists to catch, and it caught this.
    #
    # It still works: while the machine is handed over and nothing is
    # actually paused, `daemon`'s `Resume` arm treats it as this. That is the
    # only sentence with two meanings here, and the situation tells them
    # apart -- see the comment there.
    #
    # Apostrophes are stripped by `intent::normalize` on both sides, so
    # "it's mine again" would be a second, identical entry for the one below.
    # "take it back" is not here either: `history` has it, meaning undo the
    # change you just made. Two commands cannot share a phrase -- the
    # longest-phrase rule has nothing left to separate them by -- and the one
    # that loses simply never fires. Both of these collisions were found by
    # the suite rather than by reading, which is the whole reason that guard
    # is a test and not a convention.
    phrases:
      ["its me again", "this is mine again", "its mine again",
       "hand it back", "give it back", "end the handover", "handover back"]

  # Talking to somebody you work with, inside Atlas. `raw_argument` for the
  # same reason `dictate` has it: this is a sentence a person will read, and
  # `normalize` strips the case and punctuation that make it read like one.
  #
  # "tell" is deliberately not a phrase here. It is the most natural thing to
  # say and it is far too broad -- "tell me what's outstanding" would become a
  # message to somebody called "me".
  - intent: message
    describe: "Send a message to a friend or group. arg: who and what to say."
    phrases: ["message", "send a message to", "send a message", "say to"]
    takes_argument: true
    raw_argument: true

  # Who is in a group, and which members you can actually reach. "who's in the
  # Northwind group", "who is in Jordan, Maya", "members of the project group".
  - intent: who_is_in
    describe: "Say who is in a group. arg: the group."
    phrases: ["whos in", "who is in", "who's in", "members of"]
    takes_argument: true
    argument_optional: false

  # Give a group a name so you can reach it by that name later. "name the
  # Jordan, Maya group as Northwind project", "call the roofing group Roofing".
  - intent: name_group
    describe: "Name or rename a group. arg: the group and the new name."
    phrases: ["name the", "rename the", "call the"]
    takes_argument: true
    argument_optional: false

  # Walk out of a group: drop your copy, tell the others, and don't get pulled
  # back in by a message in flight. "leave the Northwind group", "leave the
  # roofing group".
  - intent: leave_group
    describe: "Leave a group. arg: the group."
    phrases: ["leave the", "leave group", "exit the", "remove me from"]
    takes_argument: true
    argument_optional: false

  # Changing a group you own. Only a sentence that names a person and a group
  # becomes one ("add Sam to the Friends group"); anything else starting with
  # these words falls through as not understood.
  # Friends. "add a friend" makes a one-time link to send; a pasted link adds
  # them (read before any phrase, in `intent`); requests travel through a
  # group you share. Longer than "add", so it wins over change_group.
  - intent: friend
    describe: "Add a friend, show friend requests, or accept, decline or send one. arg: who."
    phrases: ["add a friend", "add a new friend", "add friend", "friend link", "my friend link",
              "make a friend link", "make me a friend link", "give me a friend link", "new friend link",
              "friend requests", "any friend requests", "show friend requests", "show my friend requests"]

  # Atlas's own updates (OPEN_GAPS 8.2). "install the update" is the decision,
  # as `atlas update install` is; going back asks first, with what it means.
  - intent: update_status
    describe: "Check whether an Atlas update is available and which version this is."
    phrases: ["any updates", "are there any updates", "is there an update", "is there an atlas update",
              "check for updates", "what version are you", "what version of atlas is this", "update status"]

  - intent: update_install
    describe: "Install the Atlas update."
    expose: never
    phrases: ["install the update", "install the atlas update", "update atlas", "update yourself",
              "go ahead and update"]

