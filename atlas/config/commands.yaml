    takes_argument: true
    argument_optional: true

  # Seeing, rather than reading. "Read this" is still OCR — these are the
  # questions Atlas could never answer before: what is that, who is that,
  # what am I holding.
  - intent: whats_there
    describe: "Look through the camera and say what or who is in the room."
    phrases: ["what do you see", "what can you see", "look at the room",
              "what's in front of you", "whats in front of you", "who is here",
              "who's here", "whos here", "look around"]

  # "what is this" belongs to the clipboard and has for a long time — it means
  # the thing you copied. These are the phrasings that can only mean the thing
  # in front of the camera.
  # "what is that" / "what's that" were here and turned the camera on in the
  # middle of a conversation about something said (27 Sep 2026).
  - intent: whats_this
    describe: "Look through the camera at what the user is holding up or pointing at."
    phrases: ["what is this thing",
              "what's this thing", "whats this thing", "what am i pointing at",
              "what am i pointing to", "what am i holding",
              "what am i showing you", "look at this"]

  # Deliberately not "remember this" — that is already how you capture a note,
  # and two commands that sound the same is how one of them stops working.
  - intent: name_this
    describe: "Learn the name of what the camera sees. arg: the name."
    phrases: ["this is my", "this is a", "that is my", "learn this as",
              "call this", "the name for this is"]
    takes_argument: true

  - intent: recommend
    describe: "Suggest what would make Atlas faster or more useful here."
    phrases: ["what could make you faster", "what am i missing",
              "how could you be better", "what would help you"]

  - intent: address_as
    describe: "Change what Atlas calls the user. arg: the name."
    expose: never
    phrases: ["call me", "address me as", "you can call me", "refer to me as",
              "stop calling me", "don't call me", "dont call me",
              "just talk", "no name", "drop the"]
    takes_argument: true
    argument_optional: true

  # Asking one of your other Atlases how it is getting on. Read-only, and
  # only the ones you have named under `elsewhere` in tools.yaml.
  - intent: brief_on
    describe: "Ask one of the user's other Atlases (another device or person's Atlas) how it is going. arg: that Atlas's name."
    # "how is" and "how's" were here: "how's it going" asked for an Atlas
    # called "it going" (27 Sep 2026). The other Atlases are asked about by
    # name; only "brief me on" takes any name.
    phrases: ["brief me on"]
    takes_argument: true
    argument_optional: true

  - intent: brief_on
    describe: "Ask one of the user's other Atlases (another device or person's Atlas) how it is going. arg: that Atlas's name."
    phrases: ["how is", "how's", "check on", "look in on", "what's happening with", "whats happening with"]
    takes_argument: true
    names_only: true

  # ---- Round 11: the everyday tools (`workday`). Each takes the whole
  # sentence; the tool reads what it needs from it. Sentences with an
  # unmistakable shape ("keep in touch with Priya every month", "open 2"
  # after a list) are read before this table, by `workday::read_first`.
  - intent: clip_history
    describe: "Search or read back the clipboard history. arg: what, optional."
    phrases: ["clipboard history", "what did i copy", "what have i copied", "search my clipboard",
              "turn on clipboard history", "turn off clipboard history", "clear clipboard history",
              "paste the one"]
    takes_argument: true
    argument_optional: true
  - intent: screen_text
    describe: "Copy the text off the window on screen. arg: which window, optional."
    phrases: ["copy the text off", "copy text off the screen", "copy the text from", "grab the text",
              "copy the text in this window", "copy the text on screen"]
    takes_argument: true
    argument_optional: true
  - intent: market_day
    describe: "Say whether the stock market is open and when the next holiday is. arg: the day, optional."
    phrases: ["is the market open", "is the stock market open", "market holidays", "market calendar",
              "next market holiday", "when is the market closed", "market today", "is it a trading day"]
    takes_argument: true
    argument_optional: true
  - intent: waiting_for
    describe: "List what the user is waiting on from others and what they promised. arg: who, optional."
    phrases: ["what am i waiting on", "what am i waiting for", "who owes me", "what did i promise",
              "my promises", "waiting for list"]
    takes_argument: true
    argument_optional: true
  - intent: note_review
    describe: "Go through the user's notes in a weekly review."
    phrases: ["review my notes", "weekly review", "go through my notes"]
    takes_argument: true
    argument_optional: true
  - intent: launch
    describe: "Start a program that is not one of the known apps. arg: its name."
    phrases: ["start up", "fire up", "run the app"]
    takes_argument: true
  - intent: trade_day
    describe: "The trading check-in or journal: before or after the session. arg: which."
    phrases: ["trading check in", "pre market check", "before the session", "after the session",
              "trading journal", "journal my session", "how has my trading process been"]
    takes_argument: true
    argument_optional: true
  - intent: meeting_prep
    describe: "Prepare the user for their next meeting: who, what, and past notes. arg: which meeting, optional."
    phrases: ["prep me for my next meeting", "prep me for", "meeting prep", "who am i meeting",
              "brief me on my next meeting"]
    takes_argument: true
    argument_optional: true
  - intent: snippet
    describe: "Type or manage a saved text snippet."
    expose: never
    phrases: ["type my", "insert my", "type snippet", "insert snippet", "my snippets", "list my snippets",
              "delete snippet", "forget snippet"]
    takes_argument: true
    argument_optional: true
  - intent: find_file
    describe: "Find one of the user's files, PDFs, photos or documents. Call it rather than saying you will look. arg: what to look for."
    expose: core
    phrases: ["find the file", "find my file", "find file", "find files", "where is my file",
              "where's my file", "find the pdf", "find my pdf", "find the spreadsheet", "find the document",
              "find my photos", "find the photo", "find the presentation"]
    takes_argument: true
    argument_optional: true
  - intent: pdf
    describe: "Merge, split, extract pages from or sign PDFs. arg: what."
    phrases: ["merge the pdfs", "merge pdfs", "combine the pdfs", "extract pages", "split the pdf",
              "sign the pdf"]
    takes_argument: true
    argument_optional: true
  - intent: people
    describe: "Who the user should catch up with, and notes about people. arg: who, optional."
    phrases: ["who should i catch up with", "who haven't i talked to",
              "keep in touch with", "stop keeping in touch with", "note about"]
    takes_argument: true
    argument_optional: true
  - intent: feeds
    describe: "Follow or unfollow sites and read what is new in the user's feeds. arg: which site, optional."
    phrases: ["subscribe to", "follow the site", "follow the blog", "unfollow", "stop following", "my feeds", "what's new in my feeds",
              "any new articles", "reading list", "what am i following"]
    takes_argument: true
    argument_optional: true
  - intent: social
    describe: "The user's own social media accounts (how a video or post did, what worked, posting times, followers, importing a platform's export, refreshing the numbers) and watching other channels, hashtags and topics (what's trending, what's working for them, reading one TikTok/Instagram/X page). arg: what they asked."
    phrases: ["how did my last video do", "how did my last post do", "how's my last video doing", "what worked this month",
              "what worked this week", "my best post", "best time to post", "when should i post", "my followers",
              "follower count", "import my export", "import my archive", "refresh my numbers", "my social accounts",
              "what's trending", "what is trending", "start watching", "stop watching", "keep an eye on",
              "my watch list", "what's working for them", "read this tiktok", "read this instagram", "read this tweet"]
    takes_argument: true
    argument_optional: true
  # Opportunity hunting (29 Sep 2026): gigs, jobs, grants, contracts and
  # niches found once a day. Numbered follow-ups ("tell me more about 3",
  # "save 2") and whole-sentence shapes ("look for video editing gigs", "not
  # interested in crypto") are read first by `hunt::understand` through
  # `workday::read_first`; these phrases are the ways in that start a
  # sentence. It never applies, replies or spends.
  - intent: opportunities
    describe: "Opportunities (gigs, jobs, grants, niches) Atlas found for the user: list them, more on one, not interested, save, or what to look for and skip. Never trading. arg: the user's sentence."
    phrases: ["any opportunities", "any new opportunities", "show me opportunities", "show me the opportunities",
              "what opportunities have you found", "any gigs", "any new gigs", "find me gigs", "find me opportunities",
              "saved opportunities", "start hunting for opportunities", "stop hunting for opportunities",
              "look for opportunities", "skip opportunities about", "my skills are"]
    takes_argument: true
    argument_optional: true
  # How much of a smart-ass Atlas may be (29 Sep 2026). The whole sentence
  # only: "tone it down in the email to Maya" is about the email.
  - intent: wit
    describe: "Change how much of a smart-ass Atlas is: more, less, off, dry or full. arg: the user's sentence."
    phrases: ["be more of a smartass", "be more of a smart ass", "be a smartass", "be a smart ass", "tone it down",
              "dial it back", "less sarcasm", "no more jokes", "be more sarcastic", "be less sarcastic",
              "stop being a smartass", "stop being a smart ass"]
    anchored: true
  - intent: receipt
    describe: "Keep or read a receipt, and what the user spent at a place or this month. arg: what."
    phrases: ["keep this receipt", "read this receipt", "save this receipt", "what did i spend at", "what did i spend this month",
              "how much did i spend at", "my receipts", "receipts for"]
    takes_argument: true
    argument_optional: true
  - intent: habit
    describe: "Track the user's habits: add one, check them, or pause them. arg: which."
    phrases: ["new habit", "how are my habits", "my habits", "pause my habits",
              "stop tracking", "add a habit"]
    takes_argument: true
    argument_optional: true
  - intent: cards
    describe: "Flashcards: quiz the user, review due cards, or make a card. arg: what."
    phrases: ["quiz me", "review my cards", "flashcards", "how many cards are due", "make a card"]
    takes_argument: true
    argument_optional: true
  - intent: translate
    describe: "Translate text into another language. arg: the text and the language."
    phrases: ["translate", "what does this say in", "say this in"]
    takes_argument: true
    argument_optional: true

  # Call notes (Eric, 24 Sep 2026: "call: yes notes, voices ask then record").
  # Your side is noted; nobody else is recorded until you tell Atlas they said
  # yes. See src/callnotes.rs.
  - intent: call_notes_on
    describe: "Start taking notes on the call the user is on."
    phrases: ["take notes on this call", "take call notes", "note this call",
              "start call notes"]

  - intent: call_record_everyone
    describe: "Record everyone on the call, not just the user."
    expose: never
    phrases: ["record everyone", "record the whole call", "record both sides",
              "record them too"]

  - intent: call_they_agreed
    describe: "The other people on the call agreed to being recorded."
    expose: never
    phrases: ["they said yes", "they're fine with it", "theyre fine with it",
              "everyone agreed", "they agreed"]

  - intent: call_they_declined
    describe: "The other people on the call declined being recorded."
    expose: never
    phrases: ["they said no", "they don't want it recorded", "they dont want it recorded",
              "they didn't agree", "they didnt agree"]

  - intent: call_couldnt_ask
    describe: "The user could not ask the others about recording."
    expose: never
    phrases: ["i couldn't ask them", "i couldnt ask them", "i can't ask them", "i cant ask them"]

  - intent: call_no_answer
    describe: "Nobody answered the question about recording."
    expose: never
    phrases: ["nobody answered", "no one answered", "they didn't answer", "they didnt answer"]

  - intent: call_just_mine
    describe: "Record only the user's side of the call."
    expose: never
    phrases: ["just my side", "only my side", "just me"]

  - intent: call_status
    describe: "Say whether Atlas is recording the call and what."
    phrases: ["are you recording", "what are you recording", "is this being recorded"]

  - intent: call_what_it_does
    describe: "Explain what the call recording does, to tell the others."
    phrases: ["what do i tell them it does", "what does the recording do", "what do i say it does",
              "they want to know what it does", "they asked what it does"]

  - intent: call_notes_off
    describe: "Stop taking call notes."
    phrases: ["stop taking notes", "stop call notes", "stop recording the call",
              "the call's over", "the calls over", "call's over"]

  # Working the window in front for you (Eric, 24 Sep 2026: "yes it should").
  # "Draft" leaves the reply in the box; "until I'm back" carries on, and
  # anything you say stops it. An app Atlas doesn't know is asked about first.
  - intent: delegate
    describe: "Draft a reply to a message, or keep a conversation going until the user is back."
    phrases: ["finish this conversation until i'm back", "finish the conversation until i'm back",
              "finish this until i'm back", "keep this conversation going", "take over this conversation",
              "handle this until i'm back", "carry on with this until i'm back",
              "draft a reply to this", "draft a response to this", "write a reply to this",
              "reply to this for me"]

  # Your after-me arrangement, read back only when you ask (Eric, 24 Sep 2026).
  - intent: after_me
    describe: "Say where the user's 'if something happens to me' envelope is and who knows about it."
    phrases: ["where's my envelope", "wheres my envelope", "where is my envelope",
              "what did i arrange if something happens to me", "who knows about the envelope"]
