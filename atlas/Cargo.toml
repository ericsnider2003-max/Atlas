[profile.release]
opt-level = 3

# The window pulled in a GUI stack and the binary went from 9 MB to 20.6 MB.
# Stripping symbols and letting the linker drop unused code across crates
# gets most of that back. `panic = "abort"` is deliberately not set: Atlas
# catches and reports failures rather than dying, and that needs unwinding.
strip = true
lto = "thin"
codegen-units = 1

# Debug symbols are most of a test binary's size, and `tract` multiplied the
# count. Dropping them takes the suite from ~6.5GB of build output to under
# 2GB, which is the difference between the suite running and the linker dying
# on a bus error partway through. Backtraces keep working; only line numbers
# are lost, and a failing test names itself.
[profile.test]
debug = false

[profile.dev]
debug = false

[patch.crates-io]
# hubwin: so atlas.exe starts without WebView2Loader.dll beside it. See
# vendor/webview2-com-sys/ATLAS_VENDORED.md.
webview2-com-sys = { path = "vendor/webview2-com-sys" }
