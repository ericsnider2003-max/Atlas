# Gradle's own memory (24 Oct 2026): the app carries a 400 MB model
# (bundled-models.json), and the default 512 MB heap ran out packing it
# (compressReleaseAssets: Java heap space). The cloud runner has 16 GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
