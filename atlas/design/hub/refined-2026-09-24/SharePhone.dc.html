<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas — Share sheet (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26241f;--body:#413d37;--muted:#8b867c;--faint:#aca69b;
  --line:#e6e1d7;--accent:#c15f1c;--done-ink:#3f7d52;
  --display:"Fraunces",Georgia,serif;
  --sans:"Hanken Grotesk",-apple-system,"Segoe UI",system-ui,sans-serif;
}
body{margin:0;font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}
.tgt{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0}
.tgt .ic{width:56px;height:56px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tgt .lb{font-size:12.5px;color:var(--body)}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#0a0b0d;padding:8px;font-family:var(--sans)">
  <div style="width:100%;height:100%;background:#0e1116;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)">

    <!-- banner -->
    <div style="margin:16px 14px 0;background:linear-gradient(180deg,#fffdf9,#f6f2ea);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)">
      <svg viewBox="0 0 24 24" width="22" height="22" style="flex-shrink:0"><circle cx="12" cy="12" r="8.5" fill="none" stroke="var(--accent)" stroke-width="1.7"/><circle cx="12" cy="12" r="3.2" fill="var(--accent)"/></svg>
      <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;color:var(--ink)">Sent to Atlas</div><div style="font-size:13.5px;color:var(--muted)">Reading it now — I'll tell you what I find.</div></div>
      <span style="font-size:15px;font-weight:600;color:var(--accent)">Open</span>
    </div>

    <!-- video area behind -->
    <div style="margin:18px 14px 0;height:150px;background:#181c22;border-radius:14px;display:flex;align-items:center;justify-content:center">
      <span style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="24" height="24" fill="#cfd3d8"><path d="M8 5v14l11-7z"/></svg></span>
    </div>

    <div style="flex-grow:1"></div>

    <!-- bottom sheet -->
    <div style="background:linear-gradient(180deg,#f7f4ee,#f2eee6);border-radius:26px 26px 32px 32px;padding:12px 20px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.45)">
      <div style="width:38px;height:5px;border-radius:3px;background:#d7d1c5;margin:2px auto 16px"></div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
        <span style="width:52px;height:52px;border-radius:13px;background:#20242b;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0"><svg viewBox="0 0 24 24" width="22" height="22" fill="#cfd3d8"><path d="M8 5v14l11-7z"/></svg></span>
        <div><div style="font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink)">Sharing a video</div><div style="font-size:13.5px;color:var(--muted)">8:12 · from your browser</div></div>
      </div>

      <!-- share targets -->
      <div style="display:flex;justify-content:space-between;margin-bottom:18px">
        <div class="tgt"><span class="ic" style="background:linear-gradient(160deg,#fbe8cf,#f3d6b2);border:2px solid var(--accent)"><svg viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="8.5" fill="none" stroke="var(--accent)" stroke-width="1.8"/><circle cx="12" cy="12" r="3.4" fill="var(--accent)"/></svg></span><span class="lb" style="color:var(--accent);font-weight:600">Atlas</span></div>
        <div class="tgt"><span class="ic" style="background:#34c759"><svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M4 5h16v11H9l-4 3z"/></svg></span><span class="lb">Messages</span></div>
        <div class="tgt"><span class="ic" style="background:#3b82f6"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span><span class="lb">Mail</span></div>
        <div class="tgt"><span class="ic" style="background:#e4e0d7"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8a857c" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 011-1h11"/></svg></span><span class="lb" style="color:var(--muted)">Copy</span></div>
        <div class="tgt"><span class="ic" style="background:#e4e0d7"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8a857c" stroke-width="1.8"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></span><span class="lb" style="color:var(--muted)">Save</span></div>
      </div>

      <div style="background:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:10px;box-shadow:0 1px 3px rgba(40,32,20,.06)">
        <svg viewBox="0 0 24 24" width="16" height="16" style="flex-shrink:0;margin-top:2px" fill="none" stroke="var(--done-ink)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.3 2.3 4.7-4.8"/></svg>
        <div style="font-size:14.5px;line-height:1.45;color:var(--body)">Atlas reads it on your phone and hands it to your Atlas — nothing goes anywhere else.</div>
      </div>

      <div style="display:flex;align-items:center;gap:13px;padding:16px 2px 0;border-bottom:1px solid var(--line);margin-top:6px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--ink)" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg><span style="font-size:16px;color:var(--ink);padding-bottom:16px">Add to a project</span></div>
      <div style="display:flex;align-items:center;gap:13px;padding:16px 2px 0"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--ink)" stroke-width="1.9"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span style="font-size:16px;color:var(--ink)">Save as a concept</span></div>
    </div>
  </div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
