<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas — Give Atlas something (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{
    --ink:#37352f; --dim:#787774; --faint:#9b9a97; --edge:#eceae4; --hover:#efedea;
    --accent:#d9730d; --accent-soft:#fdecc8; --accent-tx:#b26206; --ok:#4f8a5b;
  }
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .target{display:flex;flex-direction:column;align-items:center;gap:7px;width:66px;flex:none;}
  .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;}
  .target span{font-size:11px;color:var(--dim);text-align:center;line-height:1.2;}
  .rowa{display:flex;align-items:center;gap:13px;padding:14px 4px;font-size:15.5px;color:var(--ink);border-top:1px solid #efedea;}
  .rowa svg{width:20px;height:20px;color:var(--dim);}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#000;">

  <!-- dimmed app behind (a video the person is sharing) -->
  <div style="position:absolute;inset:0;background:linear-gradient(160deg,#2b303a,#15181e);"></div>
  <div style="position:absolute;top:80px;left:20px;right:20px;height:200px;border-radius:14px;background:linear-gradient(135deg,#3a3f4a,#22262e);display:grid;place-items:center;">
    <span style="width:52px;height:52px;border-radius:99px;background:rgba(255,255,255,.9);display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="#2b303a" stroke="none"><path d="M7 4l12 8-12 8z"></path></svg></span>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.45);"></div>

  <!-- top toast: Atlas received it -->
  <div style="position:absolute;top:52px;left:14px;right:14px;background:rgba(255,255,255,.96);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:12px 15px;display:flex;align-items:center;gap:11px;">
    <svg viewBox="0 0 120 120" width="24" height="24"><circle cx="60" cy="60" r="42" fill="none" stroke="var(--accent)" stroke-width="8" opacity=".9"></circle><circle cx="60" cy="60" r="13" fill="var(--accent)"></circle></svg>
    <div style="flex:1;"><div style="font-size:13.5px;font-weight:640;">Sent to Atlas</div><div style="font-size:12px;color:var(--dim);">Reading it now — I'll tell you what I find.</div></div>
    <span style="font-size:12.5px;color:var(--accent-tx);font-weight:600;">Open</span>
  </div>

  <!-- SHARE SHEET (bottom) -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#f4f3f1;border-radius:24px 24px 0 0;padding:12px 0 22px;box-shadow:0 -8px 30px rgba(0,0,0,.25);">
    <div style="width:38px;height:5px;border-radius:99px;background:#d4d2cc;margin:0 auto 12px;"></div>

    <!-- what's being shared -->
    <div style="display:flex;align-items:center;gap:12px;padding:0 20px 14px;">
      <div style="width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,#3a3f4a,#22262e);display:grid;place-items:center;flex:none;"><svg viewBox="0 0 24 24" width="16" height="16" fill="#fff" stroke="none"><path d="M7 4l12 8-12 8z"></path></svg></div>
      <div style="flex:1;"><div style="font-size:14.5px;font-weight:600;">Sharing a video</div><div style="font-size:12.5px;color:var(--dim);">8:12 · from your browser</div></div>
    </div>

    <!-- targets row: Atlas first and highlighted -->
    <div style="display:flex;gap:10px;overflow:hidden;padding:8px 20px 6px;">
      <div class="target">
        <div class="ic" style="background:var(--accent-soft);border:2px solid var(--accent);"><svg viewBox="0 0 120 120" width="30" height="30"><circle cx="60" cy="60" r="40" fill="none" stroke="var(--accent)" stroke-width="8" opacity=".92"></circle><circle cx="60" cy="60" r="53" fill="none" stroke="var(--accent)" stroke-width="8" opacity=".28"></circle><circle cx="60" cy="60" r="12" fill="var(--accent)"></circle></svg></div>
        <span style="color:var(--accent-tx);font-weight:700;">Atlas</span>
      </div>
      <div class="target"><div class="ic" style="background:#37b24d;"><svg viewBox="0 0 24 24" width="26" height="26" fill="#fff" stroke="none"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"></path></svg></div><span>Messages</span></div>
      <div class="target"><div class="ic" style="background:#4c8bf5;"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></div><span>Mail</span></div>
      <div class="target"><div class="ic" style="background:#e9e7e2;"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#787774" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></div><span>Copy</span></div>
      <div class="target"><div class="ic" style="background:#e9e7e2;"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#787774" stroke-width="2"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"></path></svg></div><span>Save</span></div>
    </div>

    <!-- one-line: what Atlas will do -->
    <div style="margin:8px 20px 4px;background:#fff;border:1px solid var(--edge);border-radius:10px;padding:10px 13px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--ok)" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M8 12l3 3 5-6"></path></svg>
      Atlas reads it on your phone and hands it to your Atlas — nothing goes anywhere else.
    </div>

    <!-- action list -->
    <div style="padding:4px 20px 0;">
      <div class="rowa" style="border-top:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>Add to a project</div>
      <div class="rowa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Save as a concept</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
