# The dependency gate (5 Oct 2026, audit Q5). CI runs `cargo deny check` on
# every merge: a crate with a known vulnerability, a licence not listed here,
# or a source other than crates.io fails it.

[graph]
all-features = true
# Every platform Atlas ships on, so a dependency only one of them pulls in is
# still checked.
targets = [
    "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin",
    "aarch64-apple-ios", "aarch64-linux-android",
]

[advisories]
# A vulnerability always fails. An unmaintained or unsound crate fails too,
# unless it is listed here with the reason and the upgrade that removes it.
# Every one below arrives through two direct dependencies, not Atlas's own
# choice: eframe 0.28 (egui's window toolkit) and wry 0.53 (the webview, whose
# Linux path uses the GTK3 bindings). Ledger Q5 tracks the upgrades.
ignore = [
    # eframe 0.28 -> accesskit_unix -> zbus 3: gone with eframe >= 0.29 (zbus 4+).
    { id = "RUSTSEC-2024-0388", reason = "derivative, via eframe 0.28's accessibility (zbus 3); gone when eframe is upgraded" },
    { id = "RUSTSEC-2024-0384", reason = "instant, via eframe 0.28's accessibility (futures-lite 1); gone when eframe is upgraded" },
    { id = "RUSTSEC-2024-0436", reason = "paste (a build-time macro), via eframe 0.28's Windows accessibility; gone when eframe is upgraded" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via egui's font rendering; replaced when egui moves off it" },
    # wry 0.53 on Linux -> webkit2gtk -> gtk-rs 0.18 (GTK3), and its HTML parser.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (build-time), via wry's Linux GTK3 bindings (glib-macros 0.18); Linux only, not in the Windows build" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 iterator unsoundness, via wry's Linux GTK3 bindings; Atlas never iterates glib containers; Linux only" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash, via wry's HTML parser (kuchikiki/selectors); a hash function, no data from outside reaches it as a key choice" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.7, build-time only (phf_codegen inside selectors); the unsoundness needs a custom logger calling rand at run time" },
]

[licenses]
# Permissive licences, plus the font licences egui's built-in fonts carry
# (OFL-1.1, UFL-1.0) and MPL-2.0 (file-level copyleft: unmodified, it asks
# only for its notice, kept in THIRD_PARTY_NOTICES.md).
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Zlib",
    "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
    "ISC", "Unlicense", "CC0-1.0", "BSL-1.0", "BlueOak-1.0.0", "MPL-2.0",
    "OFL-1.1", "LicenseRef-UFL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Atlas itself is not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
