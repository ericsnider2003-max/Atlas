# The dependency gate (5 Oct 2026, audit Q5). CI runs `cargo deny check` on
# every merge: a crate with a known vulnerability, a licence not listed here,
# or a source other than crates.io fails it.

[graph]
all-features = true
# Every platform Atlas ships on, so a dependency only one of them pulls in is
# still checked.
targets = [
    "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin",
    "aarch64-apple-ios", "aarch64-linux-android",
]

[advisories]
# A vulnerability always fails. An unmaintained or unsound crate fails too,
# unless it is listed here with the reason.
#
# Checked target by target (6 Oct 2026, ledger Q5): cargo-deny and
# `cargo tree --target all` join the conditions of different platforms, so
# they show crates no Atlas build compiles. wry and eframe's accessibility are
# Atlas dependencies on Windows only; GTK and the Linux accessibility stack
# are theirs on Linux only. Two of these are in a real build -- ttf-parser
# (every platform) and paste (Windows, at compile time) -- and eframe 0.36
# removes both; that upgrade waits on Eric seeing Atlas's windows.
ignore = [
    # In real builds; gone with eframe >= 0.36 (fonts move to skrifa/font-types).
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (unmaintained), via egui's fonts: parses only the fonts Atlas ships; gone with eframe 0.36" },
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained, compile-time macro, nothing of it in atlas.exe), via eframe 0.28's Windows accessibility; gone with eframe 0.36" },
    # In no Atlas build: Linux backends of Windows-only dependencies.
    { id = "RUSTSEC-2024-0388", reason = "derivative: zbus 3 under accesskit_unix, eframe's Linux accessibility, which Atlas enables on Windows only" },
    { id = "RUSTSEC-2024-0384", reason = "instant: futures-lite 1 under accesskit_unix, as above; not compiled for any Atlas target" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: glib-macros 0.18 under wry's Linux GTK3 backend; wry is a Windows-only dependency of Atlas" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18: wry's Linux GTK3 backend; wry is a Windows-only dependency of Atlas" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash: wry's Linux HTML handling (kuchikiki/selectors); not compiled for any Atlas target" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.7: build-time, phf_codegen under the same selectors; not compiled for any Atlas target" },
]

[licenses]
# Permissive licences, plus the font licences egui's built-in fonts carry
# (OFL-1.1, UFL-1.0) and MPL-2.0 (file-level copyleft: unmodified, it asks
# only for its notice, kept in THIRD_PARTY_NOTICES.md).
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Zlib",
    "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
    "ISC", "Unlicense", "CC0-1.0", "BSL-1.0", "BlueOak-1.0.0", "MPL-2.0",
    "OFL-1.1", "LicenseRef-UFL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Atlas itself is not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
