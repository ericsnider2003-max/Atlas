<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name=robots content=noindex>
<title>Atlas</title>
<style>
:root{--paper:#f4efe6;--ink:#1f1b16;--ember:#d9622b;--muted:#6f675c;--sheet:#fffaf2;--line:#e2d8c8;--ok:#2f8a4c;--bad:#c2412d}
@media (prefers-color-scheme:dark){:root{--paper:#1b1814;--ink:#f2ebe0;--ember:#f07a3f;--muted:#a79d8f;--sheet:#26221c;--line:#3a342b;--ok:#5cc07e;--bad:#ef6a52}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.chip{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;box-shadow:0 2px 8px #0002}
.chip svg{width:20px;height:20px}
.grow{flex:1}
.zoom{position:fixed;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-size:20px;box-shadow:0 2px 8px #0002;cursor:pointer}
.sheet{position:fixed;right:12px;top:64px;bottom:12px;width:min(380px,calc(100vw - 24px));background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px #0003;padding:16px 16px 12px;overflow:auto;transform:translateX(110%);transition:transform .2s ease-out}
.sheet.open{transform:none}
@media (max-width:640px){.sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:62vh;border-radius:16px 16px 0 0;transform:translateY(105%)}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{margin:0 0 2px;font-size:19px}
.sheet .what{color:var(--muted);margin:0 0 12px}
.sheet .x{float:right;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;min-width:44px;min-height:44px;margin:-10px -10px 0 0}
.rows{list-style:none;margin:0 0 12px;padding:0}
.rows li{border-top:1px solid var(--line)}
.rows button{all:unset;display:flex;gap:10px;align-items:center;width:100%;padding:10px 2px;cursor:pointer;box-sizing:border-box}
.rows button:focus-visible{outline:2px solid var(--ember);border-radius:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.rows .t{flex:1;min-width:0}
.rows .t b{display:block;font-weight:600}
.rows .t span{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sortby{display:flex;gap:6px;margin:0 0 6px;font-size:13px;color:var(--muted);align-items:center}
.sortby button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;font:inherit}
.sortby button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.acts button,.tell button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;min-height:40px}
.acts button.stop{color:var(--bad)}
.tell{display:flex;gap:8px;margin-top:10px}
.tell input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.said{color:var(--muted);font-size:14px;min-height:1.4em;margin:6px 0 0}
.facts{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty{color:var(--muted);margin:4px 0 12px}
</style>
</head>
<body>
<canvas id=world aria-label="The colony: Atlas and its crew at work. Tap a building to see who's there." role=img></canvas>
<div class=top>
  <a class=chip href="/hub" aria-label="Back to Atlas"><svg viewBox="0 0 100 100" aria-hidden=true><path d="M13.51 92 L34.49 92 L60.49 10 L39.51 10 Z" fill="currentColor"/><path d="M86.49 92 L65.51 92 L39.51 10 L60.49 10 Z" fill="var(--ember)"/><circle cx=50 cy=79 r=6.5 fill="var(--ember)"/></svg><span>Back</span></a>
  <span class=grow></span>
  <span class=chip id=clock aria-live=polite></span>
</div>
<div class=zoom><button id=zin aria-label="Zoom in">+</button><button id=zout aria-label="Zoom out">−</button><button id=zfit aria-label="Show the whole colony">⤢</button></div>
<aside class=sheet id=sheet aria-live=polite></aside>
<div class=sr id=summary aria-live=polite></div>
<script>
"use strict";
// ---------------------------------------------------------------------------
// The colony. What's real comes from /hub/colony.json; everything else here
// (weather, light, walking, props) is atmosphere and claims nothing.
// ---------------------------------------------------------------------------
const W = 1400, H = 1000;
const cv = document.getElementById('world'), g = cv.getContext('2d');
const sheet = document.getElementById('sheet');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const darkQ = matchMedia('(prefers-color-scheme: dark)');

// --- A seeded random, so the trees stand in the same places every visit.
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// --- The layout: buildings on plots around a central plaza. The zone list
// comes from Atlas; plots are taken in order, and spare plots stay open so
// the place reads as having room to grow.
const PLAZA = { x: 560, y: 370, w: 280, h: 260 };
const PLOTS = [
  { x: 590, y: 90, w: 220, h: 190 },   // north: Atlas's office
  { x: 900, y: 80, w: 300, h: 230 },   // north-east
  { x: 990, y: 380, w: 300, h: 240 },  // east
  { x: 900, y: 690, w: 300, h: 230 },  // south-east
  { x: 590, y: 720, w: 220, h: 200 },  // south: the mail room, where the tube starts
  { x: 200, y: 690, w: 300, h: 230 },  // south-west
  { x: 110, y: 380, w: 300, h: 240 },  // west
  { x: 200, y: 80, w: 300, h: 230 },   // north-west
  { x: 1240, y: 110, w: 130, h: 170 }, // spare
  { x: 30, y: 760, w: 130, h: 160 },   // spare
];
const TONE = {
  office:       { floor: '#e9dcc6', trim: '#d9622b' },
  lab:          { floor: '#dfe8e6', trim: '#3f8f86' },
  factory:      { floor: '#e3ddd3', trim: '#b08a2e' },
  printing:     { floor: '#eadfe8', trim: '#8a4f86' },
  mail_room:    { floor: '#e6e1d6', trim: '#4f6fa8' },
  cafeteria:    { floor: '#efe0cc', trim: '#c9772f' },
  computer_lab: { floor: '#dde2ea', trim: '#4a5a7a' },
  boardroom:    { floor: '#e2d6c9', trim: '#6b4a3a' },
};
const SEATS = [
  { id: 'mover', color: '#e0563a', prop: 'lean' },
  { id: 'sceptic', color: '#5a6fb0', prop: 'arms' },
  { id: 'operator', color: '#3f9a6b', prop: 'clipboard' },
  { id: 'user', color: '#c79a2a', prop: 'none' },
  { id: 'steward', color: '#8a5aa6', prop: 'ledger' },
];
const HAND_TINT = ['#3f7fb5', '#b5573f', '#4f9a5a', '#9a6fb5', '#b59a3f', '#3fa6a0', '#b53f7a', '#6f6f6f'];

let zones = [], rooms = {}, snap = null, asleep = false, misses = 0;
let cam = { x: W / 2, y: H / 2, s: 1 };
let people = {};             // id -> sprite
let lastCapsule = 0, flights = [];
let trees = [], clouds = [];
let selected = null;         // { kind: 'room'|'worker'|'atlas', id }
let sortKey = 'since';

function layout(list) {
  zones = list; rooms = {};
  list.forEach((z, i) => {
    const p = PLOTS[i]; if (!p) return;
    const r = { ...p, z, tone: TONE[z.id] || { floor: '#e6e1d6', trim: '#888' } };
    // The door faces the plaza.
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, px = PLAZA.x + PLAZA.w / 2, py = PLAZA.y + PLAZA.h / 2;
    const dx = px - cx, dy = py - cy;
    if (Math.abs(dx) * 0.9 > Math.abs(dy)) r.door = { x: dx > 0 ? r.x + r.w : r.x, y: cy, side: dx > 0 ? 'e' : 'w' };
    else r.door = { x: cx, y: dy > 0 ? r.y + r.h : r.y, side: dy > 0 ? 's' : 'n' };
    const edge = { x: Math.min(Math.max(r.door.x, PLAZA.x + 20), PLAZA.x + PLAZA.w - 20), y: Math.min(Math.max(r.door.y, PLAZA.y + 20), PLAZA.y + PLAZA.h - 20) };
    r.plaza = edge;
    rooms[z.id] = r;
  });
  seed = 7; trees = [];
  for (let i = 0; i < 90; i++) {
    const t = { x: rnd() * W, y: rnd() * H, r: 10 + rnd() * 14, hue: rnd() };
    if (inAnyRoom(t.x, t.y, 26) || inRect(t.x, t.y, PLAZA, 10) || onPath(t.x, t.y)) continue;
    trees.push(t);
  }
  clouds = Array.from({ length: 5 }, () => ({ x: rnd() * W, y: rnd() * H, r: 120 + rnd() * 160, v: 4 + rnd() * 6 }));
}
function inRect(x, y, r, pad = 0) { return x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad; }
function inAnyRoom(x, y, pad) { return PLOTS.some(p => inRect(x, y, p, pad)); }
function onPath(x, y) {
  return Object.values(rooms).some(r => distToSeg(x, y, r.door, r.plaza) < 30);
}
function distToSeg(x, y, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / l));
  return Math.hypot(x - (a.x + t * dx), y - (a.y + t * dy));
}

// --- Stations: one per worker a room holds, at least three, laid out in rows.
function stations(r, n) {
  const pad = 34, cols = Math.max(2, Math.floor((r.w - pad * 2) / 70));
  const out = [];
  for (let i = 0; i < n; i++) {
    const c = i % cols, row = Math.floor(i / cols);
    out.push({ x: r.x + pad + 20 + c * ((r.w - pad * 2 - 40) / Math.max(1, cols - 1)), y: r.y + pad + 22 + row * 64 });
  }
  return out;
}

// ---------------------------------------------------------------------------
// People. Each sprite walks between waypoints; where it wants to be comes
// from the snapshot, how it gets there is atmosphere.
// ---------------------------------------------------------------------------
function person(id, role, color) {
  if (!people[id]) {
    const start = rooms.mail_room ? { ...rooms.mail_room.door } : { x: W / 2, y: H / 2 };
    people[id] = { id, role, color, x: start.x, y: start.y, route: [], face: 0, pose: 'idle', room: null, seen: 0, bob: rnd() * 6 };
  }
  const p = people[id]; p.color = color || p.color; return p;
}
function roomAt(x, y) { return Object.values(rooms).find(r => inRect(x, y, r, -2)); }
function goTo(p, x, y) {
  const last = p.route.length ? p.route[p.route.length - 1] : p;
  if (Math.hypot(last.x - x, last.y - y) < 3) return;
  const from = roomAt(p.x, p.y), to = roomAt(x, y);
  const route = [];
  if (from && from !== to) route.push({ ...from.door }, { ...from.plaza });
  if (to && to !== from) route.push({ ...to.plaza }, { ...to.door });
  route.push({ x, y });
  p.route = still ? [] : route;
  if (still) { p.x = x; p.y = y; }
}
function step(p, dt) {
  const speed = p.role === 'manager' ? 150 : 70;
  let left = speed * dt;
  while (left > 0 && p.route.length) {
    const t = p.route[0], dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);
    if (d <= left) { p.x = t.x; p.y = t.y; p.route.shift(); left -= d; }
    else { p.x += dx / d * left; p.y += dy / d * left; p.face = Math.atan2(dy, dx); left = 0; }
  }
}
const walking = p => p.route.length > 0;

// --- Deciding where everyone should be, from the snapshot.
let atlasWander = { at: 0, target: null }, seatWander = {};
function place(now) {
  if (!snap) return;
  const seen = new Set();
  const busyZones = {};
  // Workers: each at their own station in their building.
  const byZone = {};
  snap.workers.filter(w => w.standing !== 'waiting').forEach(w => (byZone[w.zone] = byZone[w.zone] || []).push(w));
  Object.entries(byZone).forEach(([z, ws]) => {
    const r = rooms[z]; if (!r) return;
    const st = stations(r, Math.max(3, ws.length));
    ws.sort((a, b) => a.id - b.id).forEach((w, i) => {
      const p = person('w' + w.id, 'worker', HAND_TINT[w.id % HAND_TINT.length]);
      p.worker = w; p.station = st[i]; seen.add(p.id);
      if (!p.route.length && Math.hypot(p.x - st[i].x, p.y - st[i].y - 16) > 2) goTo(p, st[i].x, st[i].y + 16);
      p.pose = walking(p) ? 'walk' : w.standing === 'working' ? (z === 'mail_room' || z === 'factory' ? 'carry' : 'work') : 'hold';
      if (w.standing === 'working') busyZones[z] = true;
    });
  });
  // Waiting errands queue outside the mail room.
  const waiting = snap.workers.filter(w => w.standing === 'waiting');
  waiting.forEach((w, i) => {
    const r = rooms.mail_room; if (!r) return;
    const p = person('w' + w.id, 'worker', HAND_TINT[w.id % HAND_TINT.length]);
    p.worker = w; seen.add(p.id);
    const qx = r.door.x - 60 + (i % 6) * 22, qy = r.door.y - 26 - Math.floor(i / 6) * 22;
    if (!p.route.length) goTo(p, qx, qy);
    p.pose = walking(p) ? 'walk' : 'idle';
  });
  // Free hands: in the cafeteria, in twos and threes.
  const working = snap.workers.filter(w => w.kind === 'crew' && w.standing !== 'waiting').length;
  const free = Math.max(0, snap.hands - working);
  const caf = rooms.cafeteria;
  for (let i = 0; i < free && caf; i++) {
    const p = person('hand' + i, 'hand', HAND_TINT[(i + 3) % HAND_TINT.length]);
    seen.add(p.id);
    const table = i % 3, seat = Math.floor(i / 3) % 4;
    const tx = caf.x + 70 + table * 80 + (seat % 2) * 26 - 13, ty = caf.y + 110 + (table % 2) * 50 + Math.floor(seat / 2) * 34 - 17;
    if (!p.route.length && Math.hypot(p.x - tx, p.y - ty) > 2) goTo(p, tx, ty);
    p.pose = walking(p) ? 'walk' : 'chat';
  }
  // Atlas: in the boardroom presiding, at its desk when focused, otherwise
  // walking the colony, looking in where work is happening.
  const atlas = person('atlas', 'atlas', '#1f1b16'); seen.add('atlas');
  const board = rooms.boardroom, office = rooms.office;
  let atlasMode = 'roam';
  if (snap.council_sitting && board) atlasMode = 'preside';
  else if ((snap.atlas.busy || snap.paused) && office) atlasMode = 'desk';
  if (atlasMode === 'preside') { const l = lectern(board); if (!atlas.route.length) goTo(atlas, l.x, l.y); }
  else if (atlasMode === 'desk') { const d = { x: office.x + office.w / 2, y: office.y + 92 }; if (!atlas.route.length) goTo(atlas, d.x, d.y); }
  else if (!atlas.route.length && now > atlasWander.at) {
    const live = Object.keys(busyZones).map(z => rooms[z]).filter(Boolean);
    const pick = live.length && rnd() < 0.75 ? live[Math.floor(rnd() * live.length)] : null;
    const t = pick ? { x: pick.x + 30 + rnd() * (pick.w - 60), y: pick.y + pick.h - 34 } : { x: PLAZA.x + 40 + rnd() * (PLAZA.w - 80), y: PLAZA.y + 40 + rnd() * (PLAZA.h - 80) };
    goTo(atlas, t.x, t.y); atlasWander.at = now + 6000 + rnd() * 6000;
  }
  atlas.pose = walking(atlas) ? 'walk' : atlasMode === 'preside' ? 'speak' : atlasMode === 'desk' ? 'work' : 'idle';
  atlas.mode = atlasMode;
  // The council: seated when sitting; following Atlas while it walks;
  // off on their own business while it's at its desk.
  SEATS.forEach((s, i) => {
    const p = person('seat-' + s.id, 'seat', s.color); p.seat = s; seen.add(p.id);
    if (atlasMode === 'preside') {
      const c = chairs(board)[i]; if (!p.route.length && Math.hypot(p.x - c.x, p.y - c.y) > 2) goTo(p, c.x, c.y);
      p.pose = walking(p) ? 'walk' : 'sit';
    } else if (atlasMode === 'desk') {
      const w = seatWander[s.id] || (seatWander[s.id] = { at: 0 });
      if (!p.route.length && now > w.at) {
        const t = rnd() < 0.5 && caf ? { x: caf.x + 60 + rnd() * (caf.w - 120), y: caf.y + 60 + rnd() * (caf.h - 100) } : { x: PLAZA.x + 30 + rnd() * (PLAZA.w - 60), y: PLAZA.y + 30 + rnd() * (PLAZA.h - 60) };
        goTo(p, t.x, t.y); w.at = now + 8000 + rnd() * 9000;
      }
      p.pose = walking(p) ? 'walk' : 'chat';
    } else {
      const a = Math.PI * (0.55 + i * 0.22), d = 30 + (i % 2) * 14;
      const tx = atlas.x - Math.cos(atlas.face) * d + Math.cos(a + atlas.face) * 8, ty = atlas.y - Math.sin(atlas.face) * d + Math.sin(a + atlas.face) * 8 + (i - 2) * 9;
      if (Math.hypot(p.x - tx, p.y - ty) > 26 && !p.route.length) goTo(p, tx, ty);
      p.pose = walking(p) ? 'walk' : 'idle';
    }
  });
  // The business manager: runs each new errand out to its bench, then back.
  const bm = person('manager', 'manager', '#2b2b2b'); seen.add('manager');
  const fresh = snap.workers.filter(w => w.standing === 'working' && !bmSeen.has(w.id));
  fresh.forEach(w => bmSeen.add(w.id));
  if (fresh.length && bmRun.length === 0 && !still) {
    fresh.forEach(w => { const p = people['w' + w.id]; if (p && p.station) bmRun.push({ x: p.station.x + 18, y: p.station.y + 22 }); });
  }
  if (!bm.route.length) {
    if (bmRun.length) { const t = bmRun.shift(); goTo(bm, t.x, t.y); bm.handing = now + 1400; }
    else if (now > (bm.handing || 0)) { const tx = atlas.x + 22, ty = atlas.y + 18; if (Math.hypot(bm.x - tx, bm.y - ty) > 40) goTo(bm, tx, ty); }
  }
  bm.pose = walking(bm) ? 'run' : now < (bm.handing || 0) ? 'hand' : 'idle';
  // Anyone no longer real walks off to the cafeteria door and is gone.
  Object.keys(people).forEach(id => { if (!seen.has(id)) delete people[id]; });
}
const bmSeen = new Set(), bmRun = [];
function lectern(r) { return { x: r.x + r.w / 2, y: r.y + 38 }; }
function chairs(r) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 18;
  return [[-70, -26], [-70, 26], [0, 44], [70, 26], [70, -26]].map(([dx, dy]) => ({ x: cx + dx, y: cy + dy }));
}

// ---------------------------------------------------------------------------
// Drawing.
// ---------------------------------------------------------------------------
function light(now) {
  const h = new Date(now).getHours() + new Date(now).getMinutes() / 60;
  // 0 at midday, 1 deep night.
  const n = h >= 7 && h <= 18 ? 0 : h > 18 && h < 21 ? (h - 18) / 3 : h >= 5 && h < 7 ? (7 - h) / 2 : 1;
  return Math.max(0, Math.min(1, n));
}
function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function ground() {
  g.fillStyle = '#9fbf7c'; g.fillRect(-400, -400, W + 800, H + 800);
  // Grass texture: short strokes, seeded so it doesn't shimmer.
  seed = 99; g.strokeStyle = '#8fb06d'; g.lineWidth = 1.2;
  for (let i = 0; i < 900; i++) { const x = rnd() * W, y = rnd() * H; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 2, y - 4); g.stroke(); }
  // Paths: warm wood-toned boardwalks from each door to the plaza.
  Object.values(rooms).forEach(r => {
    g.strokeStyle = '#b48a5a'; g.lineWidth = 26; g.lineCap = 'round';
    g.beginPath(); g.moveTo(r.door.x, r.door.y); g.lineTo(r.plaza.x, r.plaza.y); g.stroke();
    g.strokeStyle = '#c69c6a'; g.lineWidth = 20; g.stroke();
    // Planks.
    const dx = r.plaza.x - r.door.x, dy = r.plaza.y - r.door.y, d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
    g.strokeStyle = '#b08658'; g.lineWidth = 1;
    for (let s = 8; s < d; s += 9) { const x = r.door.x + dx / d * s, y = r.door.y + dy / d * s; g.beginPath(); g.moveTo(x + nx * 10, y + ny * 10); g.lineTo(x - nx * 10, y - ny * 10); g.stroke(); }
  });
  // The plaza: paving with a planted centre and benches.
  g.fillStyle = '#d8cdbb'; roundRect(PLAZA.x, PLAZA.y, PLAZA.w, PLAZA.h, 18); g.fill();
  g.strokeStyle = '#c9bca6'; g.lineWidth = 1;
  for (let x = PLAZA.x + 20; x < PLAZA.x + PLAZA.w; x += 20) { g.beginPath(); g.moveTo(x, PLAZA.y + 4); g.lineTo(x, PLAZA.y + PLAZA.h - 4); g.stroke(); }

// ---------------------------------------------------------------------------
// The loop.
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  const now = Date.now();
  place(now);
  Object.values(people).forEach(p => step(p, dt));
  const dpr = devicePixelRatio || 1, vw = cv.clientWidth, vh = cv.clientHeight;
  if (cv.width !== vw * dpr || cv.height !== vh * dpr) { cv.width = vw * dpr; cv.height = vh * dpr; }
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  g.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * (vw / 2 - cam.x * cam.s), dpr * (vh / 2 - cam.y * cam.s));
  const night = light(now), detail = cam.s > 1.6;
  ground();

  trees.forEach(tr => tree(tr.x, tr.y, tr.r, tr.hue));
  Object.values(rooms).forEach(r => building(r, now, night, detail));
  tubes(now);
  const order = Object.values(people).sort((a, b) => a.y - b.y);
  order.forEach(p => sprite(p, now));
  flags(now);
  weather(now, night);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// The feed. Read-only; when it can't be reached the colony just rests.
// ---------------------------------------------------------------------------
async function pull() {
  try {
    const r = await fetch('/hub/colony.json', { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) throw 0;
    const s = await r.json();
    if (!zones.length || s.zones.length !== zones.length) layout(s.zones);
    const fresh = s.capsules.filter(c => c.at > lastCapsule);
    const nowS = Date.now() / 1000;
    fresh.forEach((c, i) => { if (nowS - c.at < 15) flights.push({ to: c.to, t0: Date.now() + i * 350, dur: 1600 }); });
    if (s.capsules.length) lastCapsule = Math.max(lastCapsule, ...s.capsules.map(c => c.at));
    snap = s; asleep = false; misses = 0;
    summarise(); if (selected) show(selected, true);
  } catch (e) {
    if (++misses >= 3) asleep = true;
  }
  document.getElementById('clock').textContent = asleep ? 'Resting' : snap ? (snap.paused ? 'Paused' : snap.atlas.busy ? 'Atlas is focused' : 'Atlas is walking the floor') : '';
  setTimeout(pull, document.hidden ? 8000 : 2000);
}

function summarise() {
  const n = snap.workers.filter(w => w.standing !== 'waiting').length;
  document.getElementById('summary').textContent = `${n} at work, ${Math.max(0, snap.hands - snap.workers.filter(w => w.kind === 'crew' && w.standing !== 'waiting').length)} free. ` +
    snap.workers.map(w => `${w.what}${w.task ? ': ' + w.task : ''}, ${zoneName(w.zone)}`).join('. ');
}
const zoneName = id => (zones.find(z => z.id === id) || { name: id }).name;

// ---------------------------------------------------------------------------
// Panels: tap a room for who's there; tap a worker for what it's doing.
// ---------------------------------------------------------------------------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ago(t) { const s = Math.max(0, Date.now() / 1000 - t); return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' days ago'; }
const STANDING = { working: 'Working', pausing: 'Holding at its next safe point', holding: 'Held — nothing lost', waiting: 'Waiting for a free hand' };
const DOT = { working: 'var(--ok)', pausing: '#c79a2a', holding: '#c79a2a', waiting: 'var(--muted)' };

function show(sel, refresh) {
  selected = sel;
  if (!snap) return;
  let h = `<button class=x aria-label=Close onclick="closeSheet()">×</button>`;
  if (sel.kind === 'room') {
    const z = zones.find(z => z.id === sel.id); if (!z) return closeSheet();
    h += `<h2>${esc(z.name)}</h2><p class=what>${esc(z.what)}</p>`;
    if (sel.id === 'boardroom') {
      h += snap.council_sitting ? `<p><b>Sitting now</b>${snap.council_topic ? ' on “' + esc(snap.council_topic) + '”' : ''}.</p>` : '<p class=empty>Empty. The lights come on when Atlas asks the room.</p>';
      if (snap.convened) h += `<dl class=facts><dt>Last sat</dt><dd>${ago(snap.convened.at)}</dd><dt>On</dt><dd>${esc(snap.convened.topic || '—')}</dd><dt>The call</dt><dd>${esc(snap.convened.call || '—')}</dd></dl>`;
      else h += '<p class=empty>The council hasn\'t sat since this was built.</p>';
    } else if (sel.id === 'cafeteria') {
      const busy = snap.workers.filter(w => w.kind === 'crew' && w.standing !== 'waiting').length;
      h += `<p>${Math.max(0, snap.hands - busy)} of ${snap.hands} hands free.</p>`;
    } else if (sel.id === 'office') {
      h += snap.paused ? '<p>Paused. Nothing new starts until you say carry on.</p>' : snap.atlas.busy ? `<p><b>Focused on:</b> ${esc(snap.atlas.doing)}</p>` : '<p class=empty>Out walking the floor.</p>';
    }
    const ws = snap.workers.filter(w => w.zone === sel.id);
    if (ws.length) {
      const sorted = ws.slice().sort((a, b) => sortKey === 'name' ? a.what.localeCompare(b.what) : sortKey === 'state' ? a.standing.localeCompare(b.standing) : a.since - b.since);
      h += `<div class=sortby>Sort <button aria-pressed=${sortKey === 'since'} onclick="sortBy('since')">Oldest</button><button aria-pressed=${sortKey === 'name'} onclick="sortBy('name')">Name</button><button aria-pressed=${sortKey === 'state'} onclick="sortBy('state')">State</button></div><ul class=rows>` +
        sorted.map(w => `<li><button onclick="show({kind:'worker',id:${w.id}})"><span class=dot style="background:${DOT[w.standing]}"></span><span class=t><b>${esc(w.what)}</b><span>${esc(w.task || STANDING[w.standing])}</span></span><span aria-hidden=true>›</span></button></li>`).join('') + '</ul>';
    } else if (!['boardroom', 'cafeteria', 'office'].includes(sel.id)) h += '<p class=empty>Nobody here right now.</p>';
    const done = snap.finished.filter(f => f.zone === sel.id).slice(-5).reverse();
    if (done.length) h += '<p class=what>Lately</p><ul class=rows>' + done.map(f => `<li><button tabindex=-1><span class=dot style="background:${f.ok === true ? 'var(--ok)' : f.ok === false ? 'var(--bad)' : 'var(--muted)'}"></span><span class=t><b>${esc(f.what)}</b><span>${f.ok === true ? 'Done' : f.ok === false ? 'Didn\'t work' : 'Called off'} · ${ago(f.at)}</span></span></button></li>`).join('') + '</ul>';
    h += tellBox();
  } else if (sel.kind === 'worker') {
    const w = snap.workers.find(w => w.id === sel.id);
    if (!w) { h += '<h2>Finished</h2><p class=what>That errand is over.</p>'; sheet.innerHTML = h; return; }
    h += `<h2>${esc(w.what)}</h2><p class=what>${esc(zoneName(w.zone))}</p><dl class=facts><dt>Task</dt><dd>${esc(w.task || w.what)}</dd><dt>Status</dt><dd>${STANDING[w.standing]}</dd><dt>Started</dt><dd>${ago(w.since)}</dd></dl>`;
    h += '<div class=acts>';
    if (w.standing === 'holding' || w.standing === 'pausing') h += `<button onclick="act('resume',${w.id})">Carry on</button>`;
    else if (w.can_hold) h += `<button onclick="act('pause',${w.id})">Hold</button>`;
    h += `<button class=stop onclick="act('cancel',${w.id})">Call it off</button></div>`;
    if (!w.can_hold && w.standing === 'working') h += '<p class=what>This one has no safe point to hold at. It can finish or be called off.</p>';
    h += tellBox();
  } else if (sel.kind === 'atlas') {
    h += `<h2>Atlas</h2><p class=what>${snap.council_sitting ? 'Presiding over the council.' : snap.paused ? 'Paused.' : snap.atlas.busy ? 'At its desk.' : 'Walking the floor, looking in on the work.'}</p>`;
    if (snap.atlas.doing) h += `<dl class=facts><dt>Doing</dt><dd>${esc(snap.atlas.doing)}</dd></dl>`;
    h += tellBox();
  }
  const keep = refresh && sheet.querySelector('.tell input'), typed = keep ? keep.value : '', had = keep && document.activeElement === keep, said = sheet.querySelector('.said');
  const saidText = refresh && said ? said.textContent : '';
  sheet.innerHTML = h; sheet.classList.add('open');
  const inp = sheet.querySelector('.tell input'); if (inp) { inp.value = typed; if (had) inp.focus(); }
  const s2 = sheet.querySelector('.said'); if (s2 && saidText) s2.textContent = saidText;
}
function tellBox() { return '<form class=tell onsubmit="return tell(event)"><label class=sr for=tellit>Tell Atlas</label><input id=tellit name=text placeholder="Tell Atlas…" autocomplete=off><button>Send</button></form><p class=said></p>'; }
function closeSheet() { selected = null; sheet.classList.remove('open'); }
function sortBy(k) { sortKey = k; show(selected, true); }
async function act(what, id) {
  const said = sheet.querySelector('.said');
  try {
    const r = await fetch('/hub/colony', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'what=' + what + '&id=' + id });
    const j = await r.json(); if (said) said.textContent = j.said || '';
  } catch (e) { if (said) said.textContent = 'Atlas didn\'t answer. Nothing changed.'; }
  pull();
}
async function tell(e) {
  e.preventDefault();
  const inp = sheet.querySelector('.tell input'), said = sheet.querySelector('.said'), text = inp.value.trim();
  if (!text) return false;
  try {
    await fetch('/hub/talk', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'text=' + encodeURIComponent(text) });
    inp.value = ''; if (said) said.textContent = 'Told Atlas. Its answer is on the Talk page.';
  } catch (err) { if (said) said.textContent = 'That didn\'t reach Atlas. Try again.'; }
  return false;
}
window.show = show; window.closeSheet = closeSheet; window.sortBy = sortBy; window.act = act; window.tell = tell;

// ---------------------------------------------------------------------------
// Pan, zoom, tap.
// ---------------------------------------------------------------------------
const pointers = new Map(); let drag = null, pinch = null, moved = 0;
function toWorld(cx, cy) { return { x: cam.x + (cx - cv.clientWidth / 2) / cam.s, y: cam.y + (cy - cv.clientHeight / 2) / cam.s }; }
function clampCam() { cam.s = Math.max(fitScale() * 0.9, Math.min(4, cam.s)); cam.x = Math.max(0, Math.min(W, cam.x)); cam.y = Math.max(0, Math.min(H, cam.y)); }
function fitScale() { return Math.min(cv.clientWidth / W, cv.clientHeight / H) * 0.98; }
function zoomAt(f, cx, cy) { const a = toWorld(cx, cy); cam.s *= f; clampCam(); const b = toWorld(cx, cy); cam.x += a.x - b.x; cam.y += a.y - b.y; clampCam(); }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e); moved = 0; if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY }; else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); } cv.classList.add('dragging'); });
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, e);
  if (pointers.size === 2 && pinch) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); zoomAt(d / pinch, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); pinch = d; moved += 10; return; }
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy); cam.x -= dx / cam.s; cam.y -= dy / cam.s; clampCam(); drag = { x: e.clientX, y: e.clientY }; }
});
function up(e) {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { cv.classList.remove('dragging'); if (moved < 8) tap(e.clientX, e.clientY); drag = null; }
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); drag = null; pinch = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
function tap(cx, cy) {
  const p = toWorld(cx, cy);
  const hit = Object.values(people).filter(q => Math.hypot(q.x - p.x, q.y - p.y) < 14).sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))[0];
  if (hit && hit.worker) return show({ kind: 'worker', id: hit.worker.id });
  if (hit && (hit.role === 'atlas' || hit.role === 'manager')) return show({ kind: 'atlas' });
  if (hit && hit.role === 'seat') return show({ kind: 'room', id: 'boardroom' });
  if (hit && hit.role === 'hand') return show({ kind: 'room', id: 'cafeteria' });
  const r = Object.values(rooms).find(r => inRect(p.x, p.y, r, 4));
  if (r) { show({ kind: 'room', id: r.z.id }); focusOn(r); return; }
  closeSheet();
}
// Tapping a building zooms in on it, far enough to watch the work.
function focusOn(r) { if (cam.s > 1.6) return; animateCam(r.x + r.w / 2 + (innerWidth > 640 ? 80 : 0), r.y + r.h / 2 + (innerWidth > 640 ? 0 : 90), Math.min(cv.clientWidth / (r.w * 1.6), cv.clientHeight / (r.h * 2.2), 3)); }
function animateCam(x, y, s) {
  if (still) { cam = { x, y, s }; clampCam(); return; }
  const from = { ...cam }, t0 = performance.now();
  (function go(t) { const k = Math.min(1, (t - t0) / 300), e = 1 - Math.pow(1 - k, 3); cam.x = from.x + (x - from.x) * e; cam.y = from.y + (y - from.y) * e; cam.s = from.s + (s - from.s) * e; clampCam(); if (k < 1) requestAnimationFrame(go); })(t0);
}
document.getElementById('zin').onclick = () => zoomAt(1.4, cv.clientWidth / 2, cv.clientHeight / 2);
document.getElementById('zout').onclick = () => zoomAt(1 / 1.4, cv.clientWidth / 2, cv.clientHeight / 2);
document.getElementById('zfit').onclick = () => animateCam(W / 2, H / 2, fitScale());
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === '+' || e.key === '=') zoomAt(1.2, cv.clientWidth / 2, cv.clientHeight / 2); if (e.key === '-') zoomAt(1 / 1.2, cv.clientWidth / 2, cv.clientHeight / 2); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });

cam.s = fitScale();
layout([]);
pull();
requestAnimationFrame(frame);
</script>
</body>
</html>
