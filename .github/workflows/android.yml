# Atlas for Android, built on a cloud Linux machine.
#
# Builds the Rust core for 64-bit ARM phones with the Android NDK, then the
# app around it, and hands back an UNSIGNED release APK. Signing happens on
# Eric's own machine (atlas/mobile/sign-android.sh), where the signing key
# lives -- unless Eric puts that key in the repository's secrets, when the
# "Signed with Eric's key" step below signs it here too (24 Oct 2026). The
# app carries its models (atlas/mobile/bundled-models.json), fetched and
# fingerprint-checked by build-android.sh.
#
# Linux build minutes are the cheap kind; this needs no secrets.

name: Android app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
      # This build's own version, 0.1.<run>, in the core (atlas/build.rs) and
      # the APK's versionName alike (28 Sep 2026: every build said 0.1.0).
      ATLAS_BUILD_NUMBER: ${{ github.run_number }}
      ATLAS_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The core's build and Gradle's downloads cached (28 Sep 2026: every
      # Android build compiled everything from nothing).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: atlas -> target
          key: android-aarch64
          cache-on-failure: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            atlas/mobile/android/*.gradle.kts
            atlas/mobile/android/app/*.gradle.kts
            atlas/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: The NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # Every APK handed out must count higher than the last, or phones refuse
      # it as an update. 100 + the run number stays above the hand-built ones
      # (both hand-built APKs so far are 1).
      - name: This build's version number
        run: echo "ATLAS_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: The app (the core, then the APK)
        working-directory: atlas/mobile
        run: ./build-android.sh

      # Signed here only if Eric has put his own key in the repository's
      # secrets (ANDROID_SIGNING_P12_B64: the .p12 from ~/Atlas/signing,
      # base64; ANDROID_SIGNING_PASS: its password). Eric, 24 Oct 2026:
      # "GitHub should be able to build and sign the phone app through its
      # CI." Without them the APK stays unsigned, as before, and is signed
      # on his machine with sign-android.sh. The key is written to the
      # runner's temp folder only for this step and deleted after it.
      - name: Signed with Eric's key, if he gave it
        id: sign
        env:
          P12_B64: ${{ secrets.ANDROID_SIGNING_P12_B64 }}
          PASS: ${{ secrets.ANDROID_SIGNING_PASS }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$PASS" ]; then
            echo "No signing key in the repository's secrets: the APK stays unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/atlas-android.p12"
          printf '%s' "$P12_B64" | base64 -d > "$key"
          trap 'rm -f "$key"' EXIT
          bt="$ANDROID_HOME/build-tools/35.0.0"
          out="$RUNNER_TEMP/signed"
          mkdir -p "$out"
          for apk in atlas/mobile/android/app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk" .apk | sed 's/-unsigned$//')"
            "$bt/zipalign" -f -p 4 "$apk" "$out/$name-aligned.apk"
            "$bt/apksigner" sign --ks "$key" --ks-type PKCS12 --ks-key-alias atlas \
              --ks-pass env:PASS --key-pass env:PASS \
              --out "$out/$name-signed.apk" "$out/$name-aligned.apk"
            "$bt/apksigner" verify --print-certs "$out/$name-signed.apk" | grep -i "SHA-256 digest"
            rm -f "$out/$name-aligned.apk"
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Atlas-Android-${{ env.ATLAS_VERSION_NAME }}-${{ github.run_number }}-signed
          path: ${{ runner.temp }}/signed/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Atlas-Android-${{ env.ATLAS_VERSION_NAME }}-${{ github.run_number }}-unsigned
          path: atlas/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
