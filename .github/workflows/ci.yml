# Tests on every push to main and every pull request (5 Oct 2026 audit, Q17).
#
# Until this file, nothing ran the ~6,900 tests when code reached GitHub: the
# three workflows only build, and only on tags or by hand. Every chat ran the
# suite in its own workspace, and three pushes on 1-2 Oct arrived with guard
# tests red that nobody had run (claude/INSTALL-LOCK.md).
#
# Linux, because the suite is green there; the Windows-only failures
# (06_AUDIT_AND_GAPS/TESTING_FINDINGS.md) are their own job and would make
# this red for reasons that aren't the push's.
#
# The gates beside the tests (5 Oct 2026, audit Q9): clippy with every warning
# an error, on every build Atlas ships (it was 332 warnings, now 0); the
# dependency gate (deny.toml: vulnerabilities, licences, sources); unused
# dependencies; formatting; and a scan for secrets. Each was run green before
# it was switched on, so red means the push, not the gate.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: atlas
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang pkg-config libssl-dev libx11-dev libxtst-dev libxi-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas
      - name: The whole suite and every guard target
        # The guard targets are separate binaries `--test all` doesn't run
        # (claude/INSTALL-LOCK.md). vad_thresholds needs the recorded corpus.
        # The three round6 tests drive a real browser; on the runner Chrome
        # starts but never opens its control port (first CI run, 5 Oct 2026)
        # -- ledger Q19 until they find a browser the way Atlas does or skip
        # themselves when there is none.
        run: >
          cargo test --locked --no-fail-fast
          --test all --test name_collisions --test one_word_is_not_an_address
          --test dead_capabilities --test new_capabilities_are_wired
          --test hub_settings --test atlas_on_a_friends_machine
          --test fuzzing_the_readers
          -- --skip vad_thresholds_are_the_measured_best
          --skip round6::an_animation_that_never_moves_when_played_is_caught
          --skip round6::an_svg_animation_is_played_to_a_gif_and_each_frame_is_the_moment_asked_for
          --skip round6::asking_for_an_animation_now_also_gives_a_gif
      - name: The library's own tests
        run: cargo test --locked --lib
      - name: The phone builds compile
        run: |
          cargo check --locked --lib --no-default-features
          cargo check --locked --lib --no-default-features --features phone-llm
      - name: Tests left nothing in the tree
        run: test -z "$(git status --porcelain)" || { git status --porcelain; echo "a test wrote into the checkout"; exit 1; }

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: atlas
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang pkg-config libssl-dev libx11-dev libxtst-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas
          key: lint
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy, every warning an error (desktop)
        run: cargo clippy --locked --lib --bin atlas -- -D warnings
      - name: Clippy, every warning an error (phone builds)
        run: |
          cargo clippy --locked --lib --no-default-features -- -D warnings
          cargo clippy --locked --lib --no-default-features --features phone-llm -- -D warnings
      - name: Dependencies (vulnerabilities, licences, sources -- deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: atlas/Cargo.toml
          command: check
      - name: No unused dependencies
        run: cargo install cargo-machete --locked && cargo machete

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action (which wants a licence for an
      # organisation). Findings checked by hand are in .gitleaksignore.
      - name: Scan every commit for secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  windows:
    # The platform Eric runs. Clippy is enforced here too (Windows-only code
    # never compiles on Linux, so only this job sees it). The library's tests
    # run and report; the full suite's Windows-only failures are ledger A2.
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: atlas
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas
          key: windows-ci
      - name: Clippy, every warning an error (Windows)
        run: cargo clippy --locked --lib --bin atlas -- -D warnings
      - name: The library's own tests (reported until A2)
        run: cargo test --locked --lib
        continue-on-error: true
