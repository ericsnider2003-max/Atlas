# Atlas for iPhone and iPad, built on a cloud Mac.
#
# There's no Mac in this project (Eric, 26 Sep 2026), so GitHub's hosted Mac
# builds the app: the Rust core for aarch64-apple-ios, the Xcode project from
# atlas/mobile/ios/project.yml, then an ad hoc build signed for the iPhones
# registered in Eric's Apple Developer account.
#
# Signing: Apple's own automatic signing, driven by an App Store Connect API
# key. The distribution certificate is Apple-managed, so no private signing
# key is ever exported, stored here, or passed around. The key only lets this
# build ask Apple for a profile listing the registered devices.
#
# Secrets (repository Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       the 10-character team ID (developer.apple.com → Membership)
#   ASC_KEY_ID          the API key's ID
#   ASC_ISSUER_ID       the issuer ID shown above the keys list
#   ASC_KEY_P8          the whole text of the downloaded AuthKey_XXXX.p8
#
# Fallback, only if Apple's cloud signing refuses (it needs the key's Admin
# role): make a distribution certificate on Windows with
# atlas/mobile/ios-certificate.sh and add two more secrets,
#   DIST_CERT_P12       base64 of the .p12 it makes
#   DIST_CERT_PASSWORD  the password file's contents
# Automatic signing then uses that certificate instead of an Apple-held one.
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.1.
# The .ipa comes out as a build artifact; Atlas's own update courier carries
# it to phones after that.

name: iPhone and iPad app

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only check Apple's side of signing (about a minute), no build"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      # This build's own version, 0.1.<run>, in the core (atlas/build.rs) and
      # the app alike (28 Sep 2026: every build said 0.1.0).
      ATLAS_BUILD_NUMBER: ${{ github.run_number }}
      ATLAS_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Say what's missing, before spending Mac minutes
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets aren't set:$missing (see the top of .github/workflows/ios.yml)"
            exit 1
          fi

      - name: The App Store Connect key, for this build only
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Apple's side of signing, checked before the long build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null \
            || python3 -m pip install --quiet pyjwt cryptography
          # The phones Atlas collected (devices.txt), registered with Apple
          # first, so the profiles this build makes include them.
          ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" python3 atlas/mobile/ios/register_devices.py atlas/mobile/ios/devices.txt
          ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" python3 atlas/mobile/ios/asc_profiles.py --fix
          if [ "${{ inputs.check_only }}" = "true" ]; then
            echo "Check only: stopping before the build."
            echo "CHECK_ONLY=1" >> "$GITHUB_ENV"
          fi

      # Cached by Cargo.lock and the toolchain, not the source (28 Sep 2026:
      # a key hashing every source file missed on every change). Saved even
      # when a later step fails, so a signing failure doesn't throw away the
      # Mac minutes the core took.
      - uses: Swatinem/rust-cache@v2
        if: env.CHECK_ONLY != '1'
        with:
          workspaces: atlas -> target
          key: ios-aarch64
          cache-on-failure: true

      - name: The Rust core, for iPhone
        if: env.CHECK_ONLY != '1'
        working-directory: atlas
        run: |
          rustup target add aarch64-apple-ios
          # phone-llm-metal: the phone's own language model, on its GPU (P.7).
          cargo rustc --release --lib --no-default-features --features phone-llm-metal --target aarch64-apple-ios --crate-type staticlib
          mkdir -p mobile/ios/rustlib
          cp target/aarch64-apple-ios/release/libatlas.a mobile/ios/rustlib/

      - name: The Xcode project, from project.yml
        if: env.CHECK_ONLY != '1'
        working-directory: atlas/mobile/ios
        env:
          ATLAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Your own distribution certificate, if you gave one
        if: env.CHECK_ONLY != '1'
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          [ -n "$DIST_CERT_P12" ] || { echo "None given: Apple's cloud-managed certificate will be used."; exit 0; }
          kc="$RUNNER_TEMP/atlas.keychain-db"; kcpass=$(uuidgen)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/keys/dist.p12"
          security import "$RUNNER_TEMP/keys/dist.p12" -k "$kc" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

      - name: Build and sign (ad hoc, for the registered iPhones)
        if: env.CHECK_ONLY != '1'
        working-directory: atlas/mobile/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project Atlas.xcodeproj -scheme Atlas -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Atlas.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" MARKETING_VERSION="$ATLAS_VERSION" \
            "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Atlas.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          ls -la "$RUNNER_TEMP/export"

      - name: If signing failed, what the profiles actually grant
        if: failure()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "Profiles Xcode downloaded for this build, and the App Groups each grants:"
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            for f in "$d"/*.mobileprovision "$d"/*.provisionprofile; do
              [ -f "$f" ] || continue
              security cms -D -i "$f" > /tmp/p.plist 2>/dev/null || continue
              name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/p.plist)
              groups=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' /tmp/p.plist 2>/dev/null | grep -v '[{}]' | xargs || true)
              echo "  $name: ${groups:-no App Group}"
            done
          done
          ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" python3 atlas/mobile/ios/asc_profiles.py --after-failure || true

      - name: Which iPhones this build will install on
        if: env.CHECK_ONLY != '1'
        run: |
          app="$RUNNER_TEMP/Atlas.xcarchive/Products/Applications/Atlas.app"
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          mkdir -p "$RUNNER_TEMP/peek" && cd "$RUNNER_TEMP/peek" && unzip -q "$ipa"
          security cms -D -i Payload/Atlas.app/embedded.mobileprovision > profile.plist
          echo "Devices in the profile:"
          /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" profile.plist || echo "(none — register your iPhone first)"
          echo "Profile expires: $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' profile.plist)"

      - name: Forget the key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/atlas.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: env.CHECK_ONLY != '1'
        with:
          name: Atlas-iOS-${{ env.ATLAS_VERSION }}-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
